<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Врятуй космічну станцію</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'twinkle': 'twinkle 4s ease-in-out infinite',
                        'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        twinkle: {
                            '0%, 100%': { opacity: 0.2 },
                            '50%': { opacity: 1 },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #020617 0%, #0f172a 50%, #1e1b4b 100%);
            margin: 0;
            overflow-x: hidden;
        }
        /* Glassmorphism panel styling */
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(147, 197, 253, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        /* Custom scrollbar for options on small screens */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(147, 197, 253, 0.3);
            border-radius: 10px;
        }
        
        .btn-option {
            transition: all 0.2s ease;
        }
        .btn-option:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }
        .btn-option:active:not(:disabled) {
            transform: translateY(1px);
        }
        
        /* Correct/Incorrect animations */
        .correct-answer {
            background-color: #22c55e !important;
            border-color: #16a34a !important;
            color: white !important;
            transform: scale(1.02);
        }
        .wrong-answer {
            background-color: #ef4444 !important;
            border-color: #dc2626 !important;
            color: white !important;
            opacity: 0.8;
        }
    </style>
</head>
<body class="text-white min-h-screen flex items-center justify-center p-4 relative">

    <!-- Starry Background Container -->
    <div id="stars-container" class="absolute inset-0 pointer-events-none z-0 overflow-hidden"></div>

    <!-- MAIN CONTAINER -->
    <main class="glass-panel rounded-3xl w-full max-w-2xl mx-auto z-10 relative p-6 sm:p-10 flex flex-col min-h-[500px]">
        
        <!-- ================= MAIN MENU ================= -->
        <div id="screen-menu" class="flex flex-col items-center justify-center flex-grow text-center animate-fade-in">
            <div class="mb-6 p-4 rounded-full bg-blue-900/50 border border-blue-500/30">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                </svg>
            </div>
            <h1 class="text-3xl sm:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500 mb-6 uppercase tracking-wider">
                Врятуй Космічну<br>Станцію
            </h1>
            <p class="text-lg text-blue-200 mb-10 max-w-md mx-auto">
                Космічна станція втрачає енергію! Виконай 10 завдань, зароби якомога більше балів і врятуй станцію!
            </p>
            <button onclick="startGame()" class="w-full sm:w-auto px-10 py-4 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 rounded-xl font-bold text-xl shadow-lg transition-all transform hover:scale-105 active:scale-95 focus:outline-none focus:ring-4 focus:ring-blue-500/50">
                ПОЧАТИ ГРУ
            </button>
        </div>

        <!-- ================= GAME SCREEN ================= -->
        <div id="screen-game" class="hidden flex-col h-full flex-grow">
            
            <!-- Top HUD (Heads Up Display) -->
            <div class="flex flex-wrap justify-between items-center bg-slate-800/50 p-4 rounded-2xl border border-slate-700 mb-6 gap-4">
                <div class="flex items-center gap-2 font-semibold text-blue-300">
                    <span id="task-counter" class="text-xl">Завдання 1/10</span>
                </div>
                
                <div class="flex items-center gap-6">
                    <div class="flex items-center gap-2 font-bold">
                        <span class="text-slate-400">Рахунок:</span>
                        <span id="score-display" class="text-2xl text-yellow-400">0</span>
                    </div>
                    
                    <div class="flex items-center gap-2 font-bold text-red-400">
                        <span>Життя:</span>
                        <span id="lives-display" class="text-xl">3</span>
                    </div>
                </div>
            </div>

            <!-- Timer Bar -->
            <div class="w-full bg-slate-700/50 rounded-full h-4 mb-6 relative overflow-hidden border border-slate-600">
                <div id="timer-bar" class="bg-gradient-to-r from-cyan-400 to-blue-500 h-full rounded-full transition-all duration-1000 ease-linear w-full"></div>
                <div id="timer-text" class="absolute inset-0 flex items-center justify-center text-xs font-bold drop-shadow-md">20 с</div>
            </div>

            <!-- Question Area -->
            <div class="flex-grow flex flex-col justify-center mb-6 relative">
                <h2 id="question-text" class="text-2xl sm:text-3xl font-semibold text-center leading-tight mb-8">
                    Питання завантажується...
                </h2>

                <!-- Feedback Overlay (Правильно/Неправильно) -->
                <div id="feedback-message" class="absolute inset-0 flex items-center justify-center text-4xl font-extrabold opacity-0 pointer-events-none transition-opacity duration-300 z-20">
                    <span id="feedback-text" class="px-6 py-3 rounded-2xl bg-slate-900/90 shadow-2xl backdrop-blur-sm border-2"></span>
                </div>
                
                <!-- Options Grid -->
                <div id="options-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Buttons are generated by JS -->
                </div>
            </div>
        </div>

        <!-- ================= RESULT SCREEN ================= -->
        <div id="screen-result" class="hidden flex-col items-center justify-center flex-grow text-center">
            
            <div id="result-icon" class="mb-4">
                <!-- Icon inserted via JS based on win/loss -->
            </div>
            
            <h2 id="result-title" class="text-3xl sm:text-5xl font-extrabold mb-4 uppercase">
                Місію завершено!
            </h2>
            
            <p id="result-message" class="text-xl text-blue-200 mb-8 max-w-md mx-auto font-medium">
                Відмінно! Ти врятував космічну станцію!
            </p>
            
            <div class="bg-slate-800/60 p-6 rounded-2xl border border-slate-700 w-full max-w-sm mb-8 space-y-4">
                <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                    <span class="text-slate-400 font-semibold">Набрано балів:</span>
                    <span id="final-score" class="text-2xl font-bold text-yellow-400">0</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-slate-400 font-semibold">Правильних відповідей:</span>
                    <span id="final-correct" class="text-2xl font-bold text-green-400">0/10</span>
                </div>
            </div>
            
            <div class="flex flex-col sm:flex-row gap-4 w-full justify-center">
                <button onclick="startGame()" class="px-8 py-3 bg-blue-600 hover:bg-blue-500 rounded-xl font-bold shadow-lg transition-all transform hover:scale-105 active:scale-95">
                    ГРАТИ ЩЕ РАЗ
                </button>
                <button onclick="showMainMenu()" class="px-8 py-3 bg-slate-700 hover:bg-slate-600 rounded-xl font-bold shadow-lg transition-all transform hover:scale-105 active:scale-95 border border-slate-600">
                    ГОЛОВНЕ МЕНЮ
                </button>
            </div>
        </div>

    </main>

    <script>
        // --- 1. Generate Starry Background ---
        function createStars() {
            const container = document.getElementById('stars-container');
            const starCount = 100;
            
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                
                // Randomize star properties
                const size = Math.random() * 3 + 1; // 1px to 4px
                const x = Math.random() * 100; // 0% to 100%
                const y = Math.random() * 100; // 0% to 100%
                const opacity = Math.random() * 0.7 + 0.3;
                const animDuration = Math.random() * 3 + 2; // 2s to 5s
                const animDelay = Math.random() * 5; // 0s to 5s
                
                star.className = 'absolute bg-white rounded-full animate-twinkle';
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${x}vw`;
                star.style.top = `${y}vh`;
                star.style.opacity = opacity;
                star.style.animationDuration = `${animDuration}s`;
                star.style.animationDelay = `${animDelay}s`;
                
                container.appendChild(star);
            }
        }

        // Initialize stars on load
        window.addEventListener('DOMContentLoaded', createStars);

        // --- 2. Game Data (Questions) ---
        const questions = [
            {
                text: "Скільки буде 15 + 27?",
                options: ["42", "32", "52", "40"],
                correctIndex: 0
            },
            {
                text: "Яка планета найближча до Сонця?",
                options: ["Венера", "Земля", "Меркурій", "Марс"],
                correctIndex: 2
            },
            {
                text: "Продовж ряд: 2, 4, 8, 16, ...",
                options: ["24", "32", "30", "20"],
                correctIndex: 1
            },
            {
                text: "Скільки хвилин у двох годинах?",
                options: ["100", "60", "180", "120"],
                correctIndex: 3
            },
            {
                text: "Який океан є найбільшим на планеті Земля?",
                options: ["Тихий", "Атлантичний", "Індійський", "Північний Льодовитий"],
                correctIndex: 0
            },
            {
                text: "Скільки байтів в одному кілобайті?",
                options: ["1000", "1024", "128", "512"],
                correctIndex: 1
            },
            {
                text: "Як називається результат множення?",
                options: ["Сума", "Різниця", "Добуток", "Частка"],
                correctIndex: 2
            },
            {
                text: "Хто є автором збірки «Кобзар»?",
                options: ["Іван Франко", "Леся Українка", "Ліна Костенко", "Тарас Шевченко"],
                correctIndex: 3
            },
            {
                text: "Яка хімічна формула води?",
                options: ["CO2", "H2O", "O2", "NaCl"],
                correctIndex: 1
            },
            {
                text: "Скільки кольорів у веселці?",
                options: ["6", "8", "7", "5"],
                correctIndex: 2
            }
        ];

        // --- 3. Game State Variables ---
        let currentQuestionIndex = 0;
        let score = 0;
        let lives = 3;
        let correctAnswers = 0;
        
        let timer = 20;
        let timerInterval = null;
        let canAnswer = true;

        // --- 4. DOM Elements ---
        const screenMenu = document.getElementById('screen-menu');
        const screenGame = document.getElementById('screen-game');
        const screenResult = document.getElementById('screen-result');
        
        const taskCounterElem = document.getElementById('task-counter');
        const scoreDisplayElem = document.getElementById('score-display');
        const livesDisplayElem = document.getElementById('lives-display');
        
        const timerBarElem = document.getElementById('timer-bar');
        const timerTextElem = document.getElementById('timer-text');
        
        const questionTextElem = document.getElementById('question-text');
        const optionsGridElem = document.getElementById('options-grid');
        
        const feedbackMessageElem = document.getElementById('feedback-message');
        const feedbackTextElem = document.getElementById('feedback-text');

        // --- 5. Game Functions ---

        function showScreen(screen) {
            screenMenu.classList.add('hidden');
            screenGame.classList.add('hidden');
            screenResult.classList.add('hidden');
            screen.classList.remove('hidden');
            screen.classList.add('flex'); // Maintain flex layout
        }

        function showMainMenu() {
            showScreen(screenMenu);
        }

        function startGame() {
            // Reset state
            currentQuestionIndex = 0;
            score = 0;
            lives = 3;
            correctAnswers = 0;
            
            // Update UI
            updateHUD();
            
            showScreen(screenGame);
            loadQuestion();
        }

        function updateHUD() {
            taskCounterElem.innerText = `Завдання ${currentQuestionIndex + 1}/${questions.length}`;
            scoreDisplayElem.innerText = score;
            livesDisplayElem.innerText = lives;
        }

        function loadQuestion() {
            // Check for game over or win condition before loading
            if (lives <= 0 || currentQuestionIndex >= questions.length) {
                endGame();
                return;
            }

            canAnswer = true;
            const currentQ = questions[currentQuestionIndex];
            
            // Update HUD
            updateHUD();
            
            // Render Question Text
            questionTextElem.innerText = currentQ.text;
            
            // Render Options
            optionsGridElem.innerHTML = ''; // Clear previous
            
            currentQ.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'btn-option w-full py-4 px-6 bg-slate-800/80 hover:bg-slate-700 border border-slate-600 rounded-xl text-lg font-medium text-left focus:outline-none focus:ring-2 focus:ring-blue-500';
                btn.innerHTML = `<span class="inline-block w-8 text-blue-400 font-bold">${String.fromCharCode(65 + index)}.</span> ${opt}`;
                btn.onclick = () => handleAnswer(index, btn);
                optionsGridElem.appendChild(btn);
            });

            // Start Timer
            startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timer = 20;
            updateTimerUI();
            
            timerBarElem.classList.remove('from-red-500', 'to-orange-500', 'animate-pulse-fast');
            timerBarElem.classList.add('from-cyan-400', 'to-blue-500');

            timerInterval = setInterval(() => {
                timer--;
                updateTimerUI();
                
                // Visual warning when time is low
                if (timer === 5) {
                    timerBarElem.classList.remove('from-cyan-400', 'to-blue-500');
                    timerBarElem.classList.add('from-red-500', 'to-orange-500', 'animate-pulse-fast');
                }

                if (timer <= 0) {
                    clearInterval(timerInterval);
                    handleTimeout();
                }
            }, 1000);
        }

        function updateTimerUI() {
            timerTextElem.innerText = `${timer} с`;
            // Calculate width percentage (timer / 20 * 100)
            const widthPct = (timer / 20) * 100;
            timerBarElem.style.width = `${widthPct}%`;
        }

        function handleAnswer(selectedIndex, clickedBtn) {
            if (!canAnswer) return;
            canAnswer = false;
            clearInterval(timerInterval); // Stop timer

            const currentQ = questions[currentQuestionIndex];
            const isCorrect = (selectedIndex === currentQ.correctIndex);
            
            const allButtons = optionsGridElem.querySelectorAll('.btn-option');
            
            // Lock all buttons
            allButtons.forEach(btn => btn.disabled = true);

            if (isCorrect) {
                // Correct logic
                score += 10;
                correctAnswers++;
                clickedBtn.classList.add('correct-answer');
                showFeedback(true);
            } else {
                // Incorrect logic
                lives--;
                clickedBtn.classList.add('wrong-answer');
                // Highlight the correct one
                allButtons[currentQ.correctIndex].classList.add('correct-answer');
                showFeedback(false);
            }

            updateHUD();

            // Proceed to next question after delay
            setTimeout(nextQuestion, 1500);
        }

        function handleTimeout() {
            if (!canAnswer) return;
            canAnswer = false;
            
            lives--;
            updateHUD();
            
            const currentQ = questions[currentQuestionIndex];
            const allButtons = optionsGridElem.querySelectorAll('.btn-option');
            
            allButtons.forEach(btn => btn.disabled = true);
            allButtons[currentQ.correctIndex].classList.add('correct-answer'); // Show correct
            
            showFeedback(false, "Час вийшов!");
            
            setTimeout(nextQuestion, 1500);
        }

        function showFeedback(isCorrect, customMsg = null) {
            feedbackMessageElem.classList.remove('opacity-0');
            
            if (isCorrect) {
                feedbackTextElem.innerText = customMsg || "Правильно!";
                feedbackTextElem.className = "px-8 py-4 rounded-2xl bg-green-900/90 shadow-2xl backdrop-blur-sm border-2 border-green-500 text-green-100";
            } else {
                feedbackTextElem.innerText = customMsg || "Неправильно!";
                feedbackTextElem.className = "px-8 py-4 rounded-2xl bg-red-900/90 shadow-2xl backdrop-blur-sm border-2 border-red-500 text-red-100";
            }

            setTimeout(() => {
                feedbackMessageElem.classList.add('opacity-0');
            }, 1200);
        }

        function nextQuestion() {
            currentQuestionIndex++;
            loadQuestion();
        }

        function endGame() {
            clearInterval(timerInterval);
            
            // Populate result screen
            const titleElem = document.getElementById('result-title');
            const messageElem = document.getElementById('result-message');
            const iconElem = document.getElementById('result-icon');
            
            document.getElementById('final-score').innerText = score;
            document.getElementById('final-correct').innerText = `${correctAnswers}/10`;
            
            const successIcon = `<svg class="h-20 w-20 text-green-400 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>`;
            const failIcon = `<svg class="h-20 w-20 text-red-400 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>`;

            if (lives > 0) {
                // Game Finished naturally
                titleElem.innerText = "Місію завершено!";
                iconElem.innerHTML = successIcon;
                titleElem.classList.remove('text-red-400');
                titleElem.classList.add('text-transparent', 'bg-clip-text', 'bg-gradient-to-r', 'from-green-400', 'to-emerald-500');
            } else {
                // Failed (out of lives)
                titleElem.innerText = "Станцію не вдалося врятувати!";
                iconElem.innerHTML = failIcon;
                titleElem.classList.remove('text-transparent', 'bg-clip-text', 'bg-gradient-to-r', 'from-green-400', 'to-emerald-500');
                titleElem.classList.add('text-red-400');
            }

            // Custom feedback messages based on score
            if (score >= 80) {
                messageElem.innerText = "Відмінно! Ти врятував космічну станцію!";
                messageElem.className = "text-xl text-green-300 mb-8 max-w-md mx-auto font-medium";
            } else if (score >= 50) {
                messageElem.innerText = "Добра робота! Станція майже врятована!";
                messageElem.className = "text-xl text-yellow-300 mb-8 max-w-md mx-auto font-medium";
            } else {
                messageElem.innerText = "Спробуй ще раз і врятуй станцію!";
                messageElem.className = "text-xl text-red-300 mb-8 max-w-md mx-auto font-medium";
            }

            showScreen(screenResult);
        }

    </script>
</body>
</html>
